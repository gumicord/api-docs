<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gumicord API docs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="description" content="Gumicord theme and plugin API reference, in Japanese and English.">
  <link rel="canonical" href="https://gumicord.github.io/api-docs/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Gumicord API docs">
  <meta property="og:title" content="Gumicord API docs">
  <meta property="og:description" content="Theme and plugin API reference for Gumicord authors.">
  <meta property="og:url" content="https://gumicord.github.io/api-docs/">
  <meta property="og:image" content="https://gumicord.github.io/assets/app-icon-desktop.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Gumicord API docs">
  <meta name="twitter:description" content="Theme and plugin API reference for Gumicord authors.">
  <meta name="twitter:image" content="https://gumicord.github.io/assets/app-icon-desktop.png">
  <meta name="theme-color" content="#7c6cf0">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" id="theme-light">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css" id="theme-dark" disabled>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/prismjs@1/themes/prism.min.css" id="prism-light">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/prismjs@1/themes/prism-tomorrow.min.css" id="prism-dark" disabled>
  <style>
    .top-bar { position: fixed; top: 8px; right: 12px; z-index: 9999; display: flex; gap: 4px; align-items: center; }
    .top-bar select { font-size: 12px; padding: 2px 4px; border: 1px solid #888; border-radius: 4px; background: transparent; color: inherit; cursor: pointer; opacity: 0.85; }
    .top-bar select option { color: initial; }
    .theme-switch { display: flex; gap: 4px; }
    .theme-switch button { font-size: 12px; padding: 2px 8px; border: 1px solid #888; border-radius: 4px; background: transparent; color: inherit; cursor: pointer; opacity: 0.65; }
    .theme-switch button[aria-pressed="true"] { opacity: 1; font-weight: bold; border-width: 2px; padding: 1px 7px; }
    .top-bar a.github-mark { display: inline-flex; color: inherit; opacity: 0.75; }
    .top-bar a.github-mark:hover { opacity: 1; }
    html[data-theme="dark"] .markdown-section table td,
    html[data-theme="dark"] .markdown-section table th { background-color: transparent; border-color: #3d444d; color: #d5dbe1; }
    html[data-theme="dark"] .markdown-section table th { background-color: rgba(255,255,255,.06); }
    html[data-theme="dark"] .markdown-section table tr:nth-child(2n) { background-color: #20202a; }
    html[data-theme="dark"] .markdown-section table tr:nth-child(2n) td { background-color: transparent; }
    html[data-theme="dark"] .markdown-section code { background-color: rgba(255,255,255,.1); color: #e6edf3; }
  </style>
</head>
<body>
  <div class="top-bar">
    <select id="lang-select" aria-label="Language">
      <option value="ja">日本語</option>
      <option value="en">English</option>
    </select>
    <div class="theme-switch" role="group" aria-label="Color theme">
      <button type="button" data-mode="light" aria-pressed="false">Light</button>
      <button type="button" data-mode="dark" aria-pressed="false">Dark</button>
      <button type="button" data-mode="auto" aria-pressed="true">Auto</button>
    </div>
    <a class="github-mark" href="https://github.com/gumicord/api-docs" target="_blank" rel="noopener" aria-label="GitHub repository">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
    </a>
  </div>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Gumicord API',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: 'auto',
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script>
    if (window.Prism && Prism.languages.json && !Prism.languages.jsonc) {
      Prism.languages.jsonc = Prism.languages.json;
    }
  </script>
  <script>
    (function () {
      var KEY = 'gumicord-docs-theme';
      var light = document.getElementById('theme-light');
      var dark = document.getElementById('theme-dark');
      var prismLight = document.getElementById('prism-light');
      var prismDark = document.getElementById('prism-dark');
      var buttons = Array.prototype.slice.call(document.querySelectorAll('.theme-switch button'));
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function current() {
        try { return localStorage.getItem(KEY) || 'auto'; }
        catch (e) { return 'auto'; }
      }
      function apply(mode) {
        var darkOn = mode === 'dark' || (mode === 'auto' && media.matches);
        light.disabled = darkOn;
        dark.disabled = !darkOn;
        prismLight.disabled = darkOn;
        prismDark.disabled = !darkOn;
        try {
          document.documentElement.style.colorScheme = darkOn ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', darkOn ? 'dark' : 'light');
        } catch (e) {}
        buttons.forEach(function (b) {
          b.setAttribute('aria-pressed', b.getAttribute('data-mode') === mode ? 'true' : 'false');
        });
      }
      buttons.forEach(function (b) {
        b.addEventListener('click', function () {
          var mode = b.getAttribute('data-mode');
          try { localStorage.setItem(KEY, mode); } catch (e) {}
          apply(mode);
        });
      });
      media.addEventListener('change', function () { if (current() === 'auto') apply('auto'); });
      apply(current());

      var langSel = document.getElementById('lang-select');
      function langFromHash() {
        var m = location.hash.match(/^#\/(ja|en)(\/|$)/);
        if (m) return m[1];
        try {
          return (navigator.language || 'ja').toLowerCase().indexOf('ja') === 0 ? 'ja' : 'en';
        } catch (e) { return 'ja'; }
      }
      function syncLang() { langSel.value = langFromHash(); }
      langSel.addEventListener('change', function () {
        var lang = langSel.value;
        var h = location.hash.replace(/^#/, '');
        var swapped = h.replace(/^\/(ja|en)(\/|$)/, '/' + lang + '$2');
        if (swapped === h) {
          location.hash = '#/' + lang + '/README';
        } else {
          location.hash = '#' + swapped;
        }
      });
      window.addEventListener('hashchange', syncLang);
      syncLang();
    })();
  </script>
</body>
</html>
